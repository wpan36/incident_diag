# Local infrastructure for development and integration tests.
#
# Services are added as the milestones that need them land. Today that is MySQL,
# Kafka, Elasticsearch and Redis, plus the Incident Lab — the two demo services,
# Prometheus, Grafana and cAdvisor — behind the `lab` profile.
#
# The profile is what keeps `make up` fast: integration tests need the four
# infrastructure services and nothing else, and starting the lab would mean
# building two Go images first. `make up-lab` starts everything.
#
# Values come from the repository's .env (see .env.example). Compose does not
# find that file on its own: run through `make up` and the rest of the compose
# targets, which pass --project-directory so the repository root, rather than
# this directory, is where .env is looked for.

name: incident_diag

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-incident_diag}
      MYSQL_USER: ${MYSQL_USER:-incident}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-incident}
    # The server's own defaults would be utf8mb4_general_ci; the schema is
    # written for utf8mb4_0900_ai_ci and the two sort differently.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # Published so `go test -tags=integration` can reach it from the host.
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Other services will wait on this with
      # `depends_on: { condition: service_healthy }`, so it has to mean "ready
      # to answer queries" rather than "the container started". The server
      # restarts itself once during first-run initialization, which is what
      # start_period covers.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      # KRaft: one container is both the controller quorum and the only broker.
      # ADR 0005 rules out high availability, so there is nothing to elect.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Two client listeners, because clients reach this broker by two different
      # names: containers on this network use kafka:9092, and a Go binary or a
      # test running on the host uses localhost. A broker advertises the address
      # a client should reconnect on, so getting this wrong produces the
      # confusing failure where the first connection works and everything after
      # it times out.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Single node, so every internal topic is unreplicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # No settling delay before the first rebalance. It exists to avoid
      # reassigning partitions repeatedly while a large group starts up; here it
      # would only add three seconds to every test.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Auto-creation off, deliberately: it invents a topic with one partition
      # when a name is misspelled, and the misspelling then looks like a queue
      # nothing is consuming. internal/mq creates the topics explicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      # Published so tests and locally run binaries can reach the broker. The
      # advertised EXTERNAL address above must agree with this port.
      - "${KAFKA_PORT:-9094}:9094"
    healthcheck:
      # The broker answering an API request, not the container having started.
      # make up waits on this, and so does anything with depends_on.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    # No volume, on purpose. The message log here is disposable: MySQL is the
    # record of progress, and a message lost with the container costs a
    # re-enqueue from the reconciler, never a document. Mounting a named volume
    # would also hand the broker a root-owned directory it cannot write to.

  elasticsearch:
    # The client's major version must match the server's, so the
    # go-elasticsearch/v8 requirement in go.mod and this tag are a pair:
    # neither moves without the other.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      # One node, which is both master and data. ADR 0005 rules out a cluster,
      # so there is nothing to discover.
      discovery.type: single-node
      # No TLS and no authentication. This is local development infrastructure
      # on a private network; enabling security here would mean distributing a
      # certificate and a password for a service nothing outside Compose can
      # reach.
      xpack.security.enabled: "false"
      # Bounded, or Elasticsearch sizes its heap from the host's RAM and takes
      # a machine that is also running MySQL, Kafka and a compiler.
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      # Published so tests and locally run binaries can reach it from the host.
      - "${ES_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      # Yellow is the healthy state here: number_of_replicas is 0, but the
      # cluster still reports yellow briefly while the index is being created.
      # make up waits on this, so it has to mean "ready to answer queries".
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    ports:
      # Published so the agent worker and the API, which run on the host, can
      # reach it — the same reason MYSQL_PORT and KAFKA_PORT are published.
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      # The server answering a command, not the container having started.
      # make up waits on this.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    # No volume, on purpose. A run's event stream is a live timeline, never a
    # fact: every event it carries was written to MySQL first, and a client
    # that lost one reads GET /api/runs/{id} again. Persisting it would be
    # keeping a cache across restarts.

  # ---- Incident Lab (profile: lab) -----------------------------------------
  #
  # Two services that break on demand, so the agent is evaluated against a
  # system that actually fails. Their routes, metrics and variables come from
  # the knowledge corpus in testdata/knowledge; see docs/plans/incident-lab.md.

  checkout-service:
    profiles: [lab]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: checkout-service
    # Pinned rather than left as incident_diag-checkout-service-1, because
    # cAdvisor labels its metrics by container name and every runbook that says
    # container_cpu_usage_seconds_total "for checkout-service" assumes this.
    container_name: checkout-service
    restart: unless-stopped
    # The log directory is a bind mount owned by the host user, and the image
    # runs as a non-root user that is not them. Override LAB_UID and LAB_GID in
    # .env if `id -u` is not 1000.
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      CHECKOUT_PAYMENT_URL: http://payment-service:8080
      CHECKOUT_PAYMENT_TIMEOUT: ${CHECKOUT_PAYMENT_TIMEOUT:-2s}
      LAB_LOG_DIR: /var/log/lab
    ports:
      - "${CHECKOUT_PORT:-8081}:8080"
    volumes:
      # Read-write here, read-only for ops-mcp later. `make up-lab` creates it,
      # or Docker would and it would belong to root.
      - ./data/lab-logs:/var/log/lab
    deploy:
      resources:
        limits:
          # Without a quota there is no CPU throttling to observe, and the cpu
          # fault produces a graph that contradicts the runbook it exists for.
          cpus: "1.0"
    depends_on:
      - payment-service

  payment-service:
    profiles: [lab]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: payment-service
    container_name: payment-service
    restart: unless-stopped
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      PAYMENT_POOL_SIZE: ${PAYMENT_POOL_SIZE:-20}
      PAYMENT_PROCESSOR_LATENCY_MS: ${PAYMENT_PROCESSOR_LATENCY_MS:-50}
      LAB_LOG_DIR: /var/log/lab
    ports:
      - "${PAYMENT_PORT:-8082}:8080"
    volumes:
      - ./data/lab-logs:/var/log/lab
    deploy:
      resources:
        limits:
          cpus: "1.0"

  prometheus:
    profiles: [lab]
    image: prom/prometheus:v3.6.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A lab run is minutes long and the disk is a laptop's.
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/ready >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    profiles: [lab]
    image: grafana/grafana:12.1.1
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Anonymous viewing, because this is a local lab and a login prompt
      # between a developer and a graph buys nothing here.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  cadvisor:
    profiles: [lab]
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: unless-stopped
    # cAdvisor reads the host's cgroups, which is what the container_cpu_*
    # metrics are. It is the one container here that needs this much access, and
    # the one most likely not to start unchanged on another machine.
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    ports:
      - "${CADVISOR_PORT:-8083}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # The agent's whole reach into the operational world. Everything it can do is
  # what this server exposes, which is why it is a service of its own rather
  # than a library inside the agent worker: the boundary is legible from this
  # file.
  #
  # In the lab profile, because every target it can reach is in that profile.
  ops-mcp:
    profiles: [lab]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: ops-mcp
    container_name: ops-mcp
    restart: unless-stopped
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      # Container names, not the host ports: this reaches its targets across the
      # compose network.
      OPS_MCP_PROMETHEUS_URL: http://prometheus:9090
      OPS_MCP_PROBE_TARGETS: checkout-service=http://checkout-service:8080,payment-service=http://payment-service:8080
      OPS_MCP_LOG_ROOT: /var/log/lab
      OPS_MCP_LOG_SERVICES: checkout-service,payment-service
    ports:
      - "${OPS_MCP_PORT:-8084}:8080"
    volumes:
      # Read-only. The lab services write these; this one only reads them, and
      # the mount says so rather than trusting the code to.
      - ./data/lab-logs:/var/log/lab:ro
    depends_on:
      - prometheus
      - checkout-service
      - payment-service

volumes:
  mysql-data:
  # Unlike Kafka's log, the index is worth keeping across a restart. Its
  # contents can always be rebuilt from the files plus MySQL, but losing it
  # silently leaves every document READY and unsearchable.
  elasticsearch-data:
  # Kept so a scenario run can still be looked at after a restart.
  prometheus-data:
  grafana-data:
